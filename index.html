}

function posTiles() {
  const g = posScope();
  return `<div class="grid tiles pos-tiles">${SIKLUS.map(s => { const st = posStats(s.id, g); return `<button class="tile ${s.id === state.pos.siklus ? 'active' : ''}" data-siklus="${s.id}">
    <div class="t-name"><i class="sw" style="background:${s.color}"></i>${s.label}</div>
    <div class="t-row"><div class="t-val">${fmtPct(st.now)}</div>${spark(st.series, s.color, 90, 30)}</div>
    <div class="t-note">${deltaTxt(st.delta) || '&nbsp;'}</div>
    <div class="t-note">Rata-rata Jan–${P().months[st.L]}: ${fmtPct(st.ytd)} · ${st.full}/${st.n} posyandu 100%</div>
  </button>`; }).join('')}</div>`;
}

function trendCard() {
  const g = posScope(), L = lastMonth(), months = P().months;
  const appW = document.getElementById('app').clientWidth || 1200, narrow = appW < 700;
  const W = narrow ? Math.max(300, appW - 36) : 760, H = 300, pl = 40, pr = narrow ? 12 : 96, pt = 16, pb = 30;
  const iw = W - pl - pr, ih = H - pt - pb, x = k => pl + k / (L || 1) * iw, y = v => pt + ih - v / 100 * ih;
  let grid = '';
  for (let t = 0; t <= 100; t += 25) grid += `<line x1="${pl}" x2="${pl + iw}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" ${t ? 'stroke-dasharray="3 4"' : ''}/><text x="${pl - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${t}%</text>`;
  const xl = months.slice(0, L + 1).map((m, k) => (narrow && k % 2) ? '' : `<text x="${x(k)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${m}</text>`).join('');
  const all = SIKLUS.map(s => ({s, series: posStats(s.id, g).series}));
  // posisi label ujung garis: urutkan & beri jarak minimal 14px agar tidak bertumpuk
  const ends = all.map(({s, series}) => { let k = series.length - 1; while (k >= 0 && !isNum(series[k])) k--; return {id: s.id, k, y: k >= 0 ? y(series[k]) : null}; })
    .filter(e => e.y != null).sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
  const endY = Object.fromEntries(ends.map(e => [e.id, e.y]));
  const lines = all.map(({s, series}) => {
    const pts = series.map((v, k) => isNum(v) ? [x(k), y(v)] : null);
    const d = pts.filter(Boolean).map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
    const on = s.id === state.pos.siklus, last = pts.filter(Boolean).pop();
    return `<g class="tline ${on ? 'on' : ''}" data-siklus="${s.id}"><path class="line" d="${d}" fill="none" stroke="${s.color}" stroke-width="${on ? 3 : 2}" stroke-linejoin="round" stroke-linecap="round" opacity="${on ? 1 : .55}"/>
      ${pts.map(p => p ? `<circle cx="${p[0]}" cy="${p[1]}" r="${on ? 4 : 3}" fill="var(--card)" stroke="${s.color}" stroke-width="2" opacity="${on ? 1 : .55}"/>` : '').join('')}
      ${!narrow && last ? `<text class="end" x="${last[0] + 10}" y="${endY[s.id] + 4}" font-size="12" font-weight="${on ? 700 : 500}" fill="var(--ink-2)">${s.label}</text>` : ''}</g>`;
  });
  // label akhir: hindari tumpang tindih sederhana (geser vertikal)
  const hits = months.slice(0, L + 1).map((_, k) => `<rect class="hit" data-k="${k}" x="${x(k) - iw / (L || 1) / 2}" y="${pt}" width="${iw / (L || 1)}" height="${ih}" fill="transparent"/>`).join('');
  return `<div class="card">
    <div class="card-head" style="flex-wrap:wrap"><div><h2 class="card-title">Tren Bulanan per Siklus</h2>
      <div class="card-sub">Rata-rata capaian ${scopeTxt()} · klik legenda atau kartu siklus untuk menyorot</div></div></div>
    <div class="legend" style="margin:6px 0 0">${SIKLUS.map(s => `<span class="lg ${s.id === state.pos.siklus ? 'on' : ''}" data-siklus="${s.id}" style="cursor:pointer"><i style="background:${s.color}"></i>${s.label}</span>`).join('')}</div>
    <div class="chart" id="trendChart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tren bulanan capaian posyandu per siklus">${grid}${xl}
      <line id="xhair" x1="0" x2="0" y1="${pt}" y2="${pt + ih}" stroke="var(--ink-3)" stroke-dasharray="3 3" opacity="0"/>${lines.join('')}${hits}</svg></div>
  </div>`;
}

function posRankCard() {
  const s = SK[state.pos.siklus], L = lastMonth();
  const rows = posRows(s.id).map(r => ({r, v: ytd(r), now: r.values[L]}));
  rows.sort((a, b) => state.pos.sort === 'asc' ? (a.v ?? 999) - (b.v ?? 999) : (b.v ?? -1) - (a.v ?? -1));
  return `<div class="card">
    <div class="card-head" style="flex-wrap:wrap"><div><h2 class="card-title">Peringkat Posyandu</h2><div class="card-sub">${s.label} · rata-rata Jan–${P().months[L]}</div></div>
      ${seg('psort', [['asc', '↑ Terendah'], ['desc', '↓ Tertinggi']], state.pos.sort)}</div>
    <ul class="rank pos-rank">${rows.map((x, i) => `<li title="${esc(x.r.name)} · Dusun ${esc(x.r.dusun)}">
      <div class="pos">${i + 1}</div>
      <div class="r-body"><div class="r-name">${esc(x.r.name)} <small>${state.desa ? '' : esc(x.r.desa || '') + ' · '}${esc(x.r.dusun)}</small></div><div class="r-bar"><span style="width:${Math.min(x.v || 0, 100)}%;background:${s.color}"></span></div></div>
      <div class="r-val"><span class="rv">${fmtPct(x.v)}</span><small>${P().months[L]}: ${fmtPct(x.now)}</small></div></li>`).join('')}</ul>
  </div>`;
}

function heatCard() {
  const s = SK[state.pos.siklus], L = lastMonth(), months = P().months.slice(0, L + 1);
  const rows = posRows(s.id);
  const cell = v => !isNum(v) ? `<td class="na">–</td>` : `<td style="background:color-mix(in srgb, ${s.color} ${Math.round((0.08 + 0.62 * Math.min(v, 100) / 100) * 100)}%, transparent);color:${v >= 70 ? '#fff' : 'var(--ink)'}">${nf.format(v)}</td>`;
  return `<div class="card" style="margin-top:18px">
    <div class="card-head"><div><h2 class="card-title">Peta Panas Bulanan · ${s.label}</h2>
      <div class="card-sub">Nilai % per posyandu per bulan · makin pekat makin tinggi · pilih siklus lewat kartu di atas</div></div></div>
    <div class="tbl-wrap"><table class="heat">
      <thead><tr><th>Posyandu</th><th style="text-align:left">Desa / Dusun</th>${months.map(m => `<th>${m}</th>`).join('')}<th>Rata²</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td><b>${esc(r.name)}</b></td><td style="text-align:left;color:var(--ink-2)">${esc(r.desa || '')}<br><small>${esc(r.dusun)}</small></td>${r.values.slice(0, L + 1).map(cell).join('')}<td><b>${fmtPct(ytd(r))}</b></td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Rata-rata</td><td></td>${months.map((_, k) => `<td>${fmtPct(mean(rows.map(r => r.values[k])))}</td>`).join('')}<td>${fmtPct(mean(rows.map(ytd)))}</td></tr></tfoot>
    </table></div>
  </div>`;
}

function posMatrixCard() {
  const names = posNames();
  const get = (n, sk) => P().rows.find(r => r.name === n && r.siklus === sk);
  return `<div class="card" style="margin-top:18px">
    <div class="card-head"><div><h2 class="card-title">Rekap Posyandu × Siklus</h2>
      <div class="card-sub">Rata-rata Jan–${P().months[lastMonth()]} per siklus</div></div></div>
    <div class="tbl-wrap"><table class="heat">
      <thead><tr><th>Posyandu</th><th style="text-align:left">Desa / Dusun</th>${SIKLUS.map(s => `<th><i class="sw" style="background:${s.color}"></i>${s.label}</th>`).join('')}</tr></thead>
      <tbody>${names.map(n => { const any = P().rows.find(r => r.name === n); return `<tr><td><b>${esc(n)}</b></td><td style="text-align:left;color:var(--ink-2)">${esc(any.desa || '')}<br><small>${esc(any.dusun)}</small></td>${SIKLUS.map(s => { const r = get(n, s.id), v = r ? ytd(r) : null;
        return isNum(v) ? `<td style="background:color-mix(in srgb, var(--green) ${Math.round((0.06 + 0.5 * Math.min(v, 100) / 100) * 100)}%, transparent)">${fmtPct(v)}</td>` : '<td class="na">–</td>'; }).join('')}</tr>`; }).join('')}</tbody>
    </table></div>
  </div>`;
}

function posyanduView() {
  if (!P()) return `<div class="card"><div class="empty">Data Posyandu belum tersedia.</div></div>`;
  return posTiles()
    + `<div class="grid row-main">${trendCard()}${posRankCard()}</div>`
    + heatCard() + posMatrixCard();
}

function bindPosyandu(root) {
  root.querySelectorAll('[data-siklus]').forEach(el => el.addEventListener('click', e => {
    if (el.dataset.tabGo) return; // ditangani oleh data-tab-go
    e.stopPropagation(); state.pos.siklus = el.dataset.siklus; render();
  }));
  root.querySelectorAll('[data-tg="psort"]').forEach(b => b.onclick = e => { e.stopPropagation(); state.pos.sort = b.dataset.v; render(); });
  const svg = root.querySelector('#trendChart svg');
  if (svg) {
    const xh = svg.querySelector('#xhair');
    svg.querySelectorAll('.hit').forEach(h => {
      const k = +h.dataset.k;
      h.addEventListener('mousemove', e => {
        const cx = +h.getAttribute('x') + +h.getAttribute('width') / 2;
        xh.setAttribute('x1', cx); xh.setAttribute('x2', cx); xh.setAttribute('opacity', 1);
        const vals = SIKLUS.map(s => ({s, v: monthAvg(s.id, k, posScope())})).sort((a, b) => (b.v ?? -1) - (a.v ?? -1));
        showTip(e, `<div class="tt-title">${P().months[k]} · ${scopeTxt()}</div>` +
          vals.map(x => `<div class="tt-row"><i style="background:${x.s.color}"></i>${x.s.label}: ${fmtPct(x.v)}</div>`).join(''));
      });
      h.addEventListener('mouseleave', () => { xh.setAttribute('opacity', 0); hideTip(); });
    });
  }
}

/* ---------- render ---------- */
function render() {
  if (state.desa && !D.villages.some(v => v.name === state.desa)) state.desa = null;
  if (state.tab === 'posyandu' && !D.posyandu) state.tab = 'all';
  hideTip(); save(); renderNav();
  if (state.tab === 'posyandu') {
    document.getElementById('app').innerHTML = posyanduView();
    bindPosyandu(document.getElementById('app')); bindTabGo(document.getElementById('app'));
    runAnim(nextAnim); nextAnim = 'change';
    return;
  }
  const ind = selectedInd(), tab = state.tab;
  let html = '';
  if (tab === 'all') {
    html += kpiCards();
  } else {
    html += tiles(tab, ind);
  }
  html += `<div class="grid row-main">${mainCard(ind)}${rankCard(ind)}</div>`;
  const tc = targetCard(tab);
  if (tc) html += `<div class="grid row-2" style="grid-template-columns:minmax(0,1fr)">${tc}</div>` + matrixCard(tab);
  if (tab === 'all') html += posyanduSummaryCard();
  if (tab === 'all') html += `<div class="grid row-2">${populationCard()}${spmCompareCard()}</div>`;
  if (tab === 'penduduk') html += `<div class="grid row-2" style="grid-template-columns:minmax(0,1fr)">${populationCard()}</div>`;
  if (tab === 'spm') html += `<div class="grid row-2" style="grid-template-columns:minmax(0,1fr)">${spmCompareCard()}</div>`;
  html += dataTable(tab);
  document.getElementById('app').innerHTML = html;
  bind(ind); bindTabGo(document.getElementById('app'));
  runAnim(nextAnim); nextAnim = 'change';
}
function bindTabGo(root) {
  root.querySelectorAll('[data-tab-go]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    if (b.dataset.siklus) state.pos.siklus = b.dataset.siklus;
    state.tab = b.dataset.tabGo; window.scrollTo({top: 0}); render();
  });
}

/* ---------- animasi (GSAP) ---------- */
let nextAnim = 'intro';
const G = window.gsap, ST = window.ScrollTrigger;
const motionOK = !!G && !matchMedia('(prefers-reduced-motion: reduce)').matches;
if (motionOK && ST) G.registerPlugin(ST);
const parseNum = s => { const t = s.trim(); if (!/^-?[\d.,]+%?$/.test(t)) return null;
  return {v: Number(t.replace('%', '').replace(/\./g, '').replace(',', '.')), pct: t.endsWith('%'), dec: t.includes(',')}; };
function countUp(el, dur = 1.1) {
  const p = parseNum(el.textContent); if (!p || isNaN(p.v)) return;
  const f = new Intl.NumberFormat('id-ID', {maximumFractionDigits: p.dec ? 1 : 0}), o = {v: 0};
  G.to(o, {v: p.v, duration: dur, ease: 'power2.out', onUpdate: () => el.textContent = f.format(p.dec ? o.v : Math.round(o.v)) + (p.pct ? '%' : '')});
}
// animasi isi sebuah kartu ketika masuk layar
function animInner(card, fast) {
  const d = fast ? .6 : 1;
  card.querySelectorAll('.kpi-value, .hero-num, .t-val').forEach(el => countUp(el, 1.1 * d));
  const bars = card.querySelectorAll('.chart .bar path');
  if (bars.length) G.from(bars, {scaleY: 0, transformOrigin: '50% 100%', duration: .8 * d, ease: 'back.out(1.4)', stagger: .06});
  const lbl = card.querySelectorAll('.chart .bar text[font-weight="600"], .chart .bar circle, .chart svg > line[stroke-width], .chart svg > text[font-size="11"]');
  if (lbl.length) G.from(lbl, {autoAlpha: 0, y: 8, duration: .4, delay: .5 * d});
  const micro = card.querySelectorAll('.tile svg rect');
  if (micro.length) G.from(micro, {scaleY: 0, transformOrigin: '50% 100%', duration: .6 * d, ease: 'power2.out', stagger: .04});
  const rank = card.querySelectorAll('.rank li');
  if (rank.length) {
    G.from(rank, {autoAlpha: 0, x: 24, duration: .5 * d, ease: 'power2.out', stagger: .06});
    G.from(card.querySelectorAll('.r-bar span'), {width: 0, duration: .9 * d, ease: 'power3.out', stagger: .06, delay: .15});
    card.querySelectorAll('.rv').forEach(el => countUp(el, .9 * d));
  }
  const prog = card.querySelectorAll('.prog span');
  if (prog.length) G.from(prog, {width: 0, duration: 1 * d, ease: 'power3.out', stagger: .03, delay: .1});
  const segs = card.querySelectorAll('.contrib .seg');
  if (segs.length) G.from(segs, {scaleX: 0, transformOrigin: '0% 50%', duration: .5 * d, ease: 'power2.out', stagger: .08, delay: .2});
  card.querySelectorAll('.tg-pct, .g-pct').forEach(el => countUp(el, 1 * d));
  card.querySelectorAll('.tline path.line, .spark path').forEach(p => {
    const len = p.getTotalLength ? p.getTotalLength() : 0; if (!len) return;
    G.fromTo(p, {strokeDasharray: len, strokeDashoffset: len}, {strokeDashoffset: 0, duration: 1.2 * d, ease: 'power2.inOut', onComplete: () => { p.style.strokeDasharray = 'none'; }});
  });
  const tdots = card.querySelectorAll('.tline circle, .tline text.end');
  if (tdots.length) G.from(tdots, {autoAlpha: 0, duration: .3, delay: .9 * d, stagger: .005});
  const arcs = card.querySelectorAll('.gauge .arc');
  if (arcs.length) G.from(arcs, {attr: {'stroke-dasharray': '0 999'}, duration: 1.1 * d, ease: 'power3.out', stagger: .04});
  const gs = card.querySelectorAll('.gauge');
  if (gs.length) G.from(gs, {autoAlpha: 0, scale: .9, duration: .45 * d, ease: 'back.out(1.6)', stagger: .03});
  const cols = card.querySelectorAll('.colbar path');
  if (cols.length) G.from(cols, {scaleY: 0, transformOrigin: '50% 100%', duration: .8 * d, ease: 'back.out(1.3)', stagger: .04});
  const colTxt = card.querySelectorAll('.colbar text[font-weight="600"]');
  if (colTxt.length) G.from(colTxt, {autoAlpha: 0, y: 6, duration: .3, delay: .5 * d, stagger: .02});
  const tgRowsEl = card.querySelectorAll('.tg-row, .tg-legend li');
  if (tgRowsEl.length) G.from(tgRowsEl, {autoAlpha: 0, x: -14, duration: .35 * d, ease: 'power2.out', stagger: .025});
  const stack = card.querySelectorAll('.stack span');
  if (stack.length) G.from(stack, {scaleX: 0, transformOrigin: '0% 50%', duration: .8 * d, ease: 'power3.out', stagger: .04});
  const rows = card.querySelectorAll('tbody tr');
  if (rows.length) G.from(rows, {autoAlpha: 0, y: 10, duration: .35, ease: 'power1.out', stagger: .03});
}
function runAnim(mode) {
  if (!motionOK) return;
  if (ST) ST.getAll().forEach(t => t.kill());
  if (mode === 'none') return;
  const fast = mode !== 'intro';
  if (mode === 'intro') {
    G.timeline({defaults: {ease: 'power3.out'}})
      .from('.top', {y: -40, autoAlpha: 0, duration: .6})
      .from('.nav button', {y: -12, autoAlpha: 0, stagger: .05, duration: .4}, '-=.3')
      .from('.welcome h1, .welcome p', {y: 18, autoAlpha: 0, stagger: .08, duration: .5}, '-=.3')
      .from('.filters > *', {y: 10, autoAlpha: 0, stagger: .03, duration: .35}, '-=.3');
  } else {
    G.fromTo('.nav button.active', {scale: .9}, {scale: 1, duration: .4, ease: 'back.out(3)'});
  }
  const items = [...document.querySelectorAll('#app .card, #app .tile')];
  G.set(items, {autoAlpha: 0, y: 28});
  const enter = batch => {
    G.to(batch, {autoAlpha: 1, y: 0, duration: fast ? .45 : .7, ease: 'power3.out', stagger: .07, delay: mode === 'intro' ? .35 : 0,
      clearProps: 'transform'});
    batch.forEach(c => animInner(c, fast));
  };
  // kartu yang sudah terlihat (atau di atas layar) langsung dianimasikan;
  // sisanya menunggu di-scroll masuk layar
  const fold = innerHeight * 0.92;
  const above = items.filter(e => e.getBoundingClientRect().bottom < 0);
  if (above.length) G.set(above, {autoAlpha: 1, y: 0});
  const now = items.filter(e => { const r = e.getBoundingClientRect(); return r.bottom >= 0 && r.top <= fold; });
  const later = items.filter(e => e.getBoundingClientRect().top > fold);
  if (now.length) enter(now);
  if (later.length) {
    if (ST) { ST.batch(later, {start: 'top 92%', once: true, onEnter: enter, onEnterBack: enter}); ST.refresh(); }
    else enter(later);
  }
}
addEventListener('beforeprint', () => { if (motionOK) G.set('#app .card, #app .tile', {autoAlpha: 1, y: 0}); });

function bindPicks(root) {
  root.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
    const id = b.dataset.pick;
    if (state.tab !== 'all' && IND[id].category !== state.tab) state.tab = 'all';
    state.ind[state.tab] = id; render();
    document.getElementById('barChart')?.scrollIntoView({behavior: 'smooth', block: 'center'});
  });
}
function bind(ind) {
  const app = document.getElementById('app');
  const sel = document.getElementById('indSel');
  if (sel) sel.onchange = () => { state.ind[state.tab] = sel.value; render(); };
  bindPicks(app);
  bindTg(document.getElementById('tgCard'));
  app.querySelectorAll('.bar, .rank li, tbody tr[data-desa], .stack-row, .contrib .seg').forEach(el => el.addEventListener('click', () => toggleDesa(el.dataset.desa)));
  app.querySelectorAll('.bar').forEach(el => {
    const d = D.villages[+el.dataset.i], v = val(d, ind.id), tot = aggregate(ind.id);
    el.addEventListener('mousemove', e => showTip(e, `<div class="tt-title">${esc(d.name)}</div>
      <div class="tt-row"><i style="background:${state.desa && d.name !== state.desa ? 'var(--gray-bar)' : state.desa ? 'var(--orange)' : 'var(--green)'}"></i>${fmt(v, ind)}</div>
      ${isNum(v) && !ind.percent && tot ? `<div class="tt-title" style="margin:4px 0 0">${nf.format(v / tot * 100)}% dari total desa</div>` : ''}
      ${isNum(v) && ind.target ? `<div class="tt-title" style="margin:2px 0 0">${fmtP(pctT(v, ind.id))} dari target ${fmt(ind.target, ind)}</div>` : ''}`));
    el.addEventListener('mouseleave', hideTip);
  });
  app.querySelectorAll('.contrib .seg').forEach(el => {
    const d = D.villages[+el.dataset.i], v = val(d, ind.id);
    el.addEventListener('mousemove', e => showTip(e, `<div class="tt-title">${esc(d.name)}</div>
      <div class="tt-row"><i style="background:${el.classList.contains('sel') ? 'var(--orange)' : 'var(--green)'}"></i>${fmt(v, ind)}</div>
      <div class="tt-title" style="margin:4px 0 0">Kontribusi ${fmtP(pctT(v, ind.id))} dari target ${fmt(ind.target, ind)}</div>`));
    el.addEventListener('mouseleave', hideTip);
  });
  app.querySelectorAll('.stack-row').forEach(el => {
    el.addEventListener('mousemove', e => showTip(e, `<div class="tt-title">${esc(el.dataset.desa)}</div>
      <div class="tt-row"><i style="background:var(--green)"></i>Laki-laki ${nf.format(+el.dataset.l)}</div>
      <div class="tt-row"><i style="background:var(--purple)"></i>Perempuan ${nf.format(+el.dataset.p)}</div>`));
    el.addEventListener('mouseleave', hideTip);
  });
}

/* ---------- export ---------- */
document.getElementById('btnExport').onclick = () => {
  if (state.tab === 'posyandu' && D.posyandu) {
    const q = s => `"${String(s).replace(/"/g, '""')}"`;
    const rows = D.posyandu.rows.filter(r => !state.desa || r.desa === state.desa);
    const lines = [['Posyandu', 'Desa', 'Dusun', 'Siklus', ...D.posyandu.months, 'Rata-rata'].map(q).join(',')];
    rows.forEach(r => lines.push([q(r.name), q(r.desa || ''), q(r.dusun), q(r.siklus), ...r.values.map(v => isNum(v) ? v : ''), (x => isNum(x) ? +x.toFixed(2) : '')(ytd(r))].join(',')));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\ufeff' + lines.join('\n')], {type: 'text/csv;charset=utf-8'}));
    a.download = `UPKD_posyandu${state.desa ? '_' + state.desa : ''}.csv`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    return;
  }
  const inds = catInds(state.tab);
  const villages = state.desa ? D.villages.filter(v => v.name === state.desa) : D.villages;
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const lines = [['Desa', ...inds.map(i => i.name)].map(q).join(',')];
  villages.forEach(v => lines.push([q(v.name), ...inds.map(i => isNum(val(v, i.id)) ? val(v, i.id) : '')].join(',')));
  if (!state.desa) lines.push([q('TOTAL / RATA-RATA'), ...inds.map(i => { const a = aggregate(i.id); return isNum(a) ? +a.toFixed(2) : ''; })].join(','));
  if (inds.some(i => i.target)) {
    const r2 = x => x == null ? '' : +x.toFixed(2);
    lines.push([q('TARGET'), ...inds.map(i => i.target ?? '')].join(','));
    if (!state.desa) lines.push([q('% CAPAIAN TARGET'), ...inds.map(i => r2(pctT(aggregate(i.id), i.id)))].join(','));
    villages.forEach(v => lines.push([q(`% KONTRIBUSI ${v.name}`), ...inds.map(i => r2(pctT(val(v, i.id), i.id)))].join(',')));
  }
  const blob = new Blob(['﻿' + lines.join('\n')], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `UPKD_${state.tab}${state.desa ? '_' + state.desa : ''}.csv`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

const foot = () => document.getElementById('foot').textContent = `Sumber: ${D.source} · diperbarui ${D.generated}`;
foot();

/* ---------- live data (Google Sheets) ---------- */
const LIVE = window.UPKD_LIVE, btnR = document.getElementById('btnRefresh'), liveText = document.getElementById('liveText');
const hhmm = () => new Date().toLocaleTimeString('id-ID', {hour: '2-digit', minute: '2-digit'});
let busy = false;
async function refresh() {
  if (!LIVE || !LIVE.enabled || busy) return;
  busy = true; btnR.classList.add('busy');
  try {
    const d = await LIVE.load();
    const scrollY = window.scrollY;
    if (!d.posyandu && D.posyandu) d.posyandu = D.posyandu; // sheet Posyandu gagal dimuat: pakai yang lama
    const sig = x => JSON.stringify([x.indicators, x.villages, x.compare, x.posyandu]);
    const changed = sig(d) !== sig(D);
    setData(d);
    if (changed) { nextAnim = 'none'; render(); }
    foot(); window.scrollTo(0, scrollY);
    btnR.className = 'pill live ok'; liveText.textContent = `Live · ${hhmm()}`;
    btnR.title = `Data dari Google Sheets, diperbarui otomatis tiap ${LIVE.refreshMs / 60000} menit. Klik untuk muat ulang sekarang.`;
  } catch (e) {
    btnR.className = 'pill live err'; liveText.textContent = 'Offline · data cadangan';
    btnR.title = `Gagal memuat Google Sheets (${e.message}). Menampilkan data dari data.js. Klik untuk coba lagi.`;
  } finally { busy = false; btnR.classList.remove('busy'); }
}
if (LIVE && LIVE.enabled) {
  btnR.onclick = refresh;
  setInterval(refresh, LIVE.refreshMs);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
} else btnR.style.display = 'none';

/* sticky header: shadow + compact mode once scrolled (hysteresis avoids flicker) */
const topBar = document.querySelector('.top');
const onScroll = () => {
  const y = window.scrollY;
  if (y > 80) topBar.classList.add('scrolled'); else if (y < 20) topBar.classList.remove('scrolled');
};
addEventListener('scroll', onScroll, {passive: true}); onScroll();

const isNarrow = () => (document.getElementById('app').clientWidth || innerWidth) < 700;
let lastNarrow = isNarrow(), rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { const n = isNarrow(); if (n !== lastNarrow) { lastNarrow = n; nextAnim = 'none'; render(); } }, 150); });
render();
refresh();
})();
</script>
